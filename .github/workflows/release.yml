name: Bygg zip

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - run: bin/build-zip.sh
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: resekarta
          path: resekarta.zip
      - name: Lägg zip-filen på releasen
        if: startsWith(github.ref, 'refs/tags/v') && matrix.php == '8.3'
        uses: softprops/action-gh-release@v2
        with:
          files: resekarta.zip
